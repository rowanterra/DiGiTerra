replicaCount: 1

image:
  # Required. No public image is published. Build one from deploy/docker/Dockerfile,
  # push it to a registry the cluster can pull from, and set the repository here or
  # with --set image.repository=<registry>/<name>. With the value empty, helm
  # install stops with a message naming this setting.
  repository: ""
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  # Used for the Service port and the containerPort. The Dockerfile CMD binds
  # gunicorn to 5000, so a different value here needs a matching Dockerfile change.
  port: 5000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: digiterra.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClassName: ""
  # Linux path. App uses XDG_DATA_HOME; uploads and user_visualizations live under /data/DiGiTerra.
  mountPath: "/data"

env:
  DIGITERRA_HOST: "0.0.0.0"
  DIGITERRA_PORT: "5000"
  DIGITERRA_WARN_UPLOAD_MB: "1"
  DIGITERRA_MAX_UPLOAD_MB: "1"
  DIGITERRA_ENFORCE_UPLOAD_LIMIT: "false"
